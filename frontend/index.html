<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Citas Médicas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Sistema de Gestión de Citas Médicas</h1>
    <p class="text-center text-muted">Arquitectura de Microservicios con Node.js</p>

    <ul class="nav nav-tabs mb-4" id="mainTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabClientes">Clientes</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCitas">Citas</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabFacturacion">Facturación</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tabClientes">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Clientes</h3>
          <button class="btn btn-primary" onclick="abrirModalCliente()">+ Nuevo Cliente</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped" id="tablaClientes">
            <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Fecha Registro</th><th>Acciones</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tabCitas">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Citas</h3>
          <button class="btn btn-primary" onclick="abrirModalCita()">+ Nueva Cita</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped" id="tablaCitas">
            <thead><tr><th>ID</th><th>ID Cliente</th><th>Fecha</th><th>Hora</th><th>Médico</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tabFacturacion">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Facturación</h3>
          <button class="btn btn-primary" onclick="abrirModalFactura()">+ Nueva Factura</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped" id="tablaFacturacion">
            <thead><tr><th>ID</th><th>ID Cita</th><th>Monto</th><th>Fecha Emisión</th><th>Pagado</th><th>Acciones</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Cliente</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="clienteId">
          <div class="mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" id="clienteNombre"></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="clienteEmail"></div>
          <div class="mb-3"><label class="form-label">Teléfono</label><input type="text" class="form-control" id="clienteTelefono"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalCita" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Cita</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="citaId">
          <div class="mb-3"><label class="form-label">ID Cliente</label><select class="form-control" id="citaIdCliente"></select></div>
          <div class="mb-3"><label class="form-label">Fecha</label><input type="date" class="form-control" id="citaFecha"></div>
          <div class="mb-3"><label class="form-label">Hora</label><input type="time" class="form-control" id="citaHora"></div>
          <div class="mb-3"><label class="form-label">Médico</label><input type="text" class="form-control" id="citaMedico"></div>
          <div class="mb-3"><label class="form-label">Motivo</label><textarea class="form-control" id="citaMotivo"></textarea></div>
          <div class="mb-3"><label class="form-label">Estado</label>
            <select class="form-control" id="citaEstado">
              <option value="pendiente">Pendiente</option>
              <option value="confirmada">Confirmada</option>
              <option value="cancelada">Cancelada</option>
              <option value="completada">Completada</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarCita()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalFactura" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Factura</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="facturaId">
          <div class="mb-3"><label class="form-label">ID Cita</label><input type="number" class="form-control" id="facturaIdCita"></div>
          <div class="mb-3"><label class="form-label">Monto</label><input type="number" step="0.01" class="form-control" id="facturaMonto"></div>
          <div class="mb-3"><label class="form-label">Pagado</label>
            <select class="form-control" id="facturaPagado">
              <option value="false">No</option>
              <option value="true">Sí</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarFactura()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
